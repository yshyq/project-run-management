<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目支持管理系统</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen">
      <form class="login-panel" id="loginForm">
        <div class="brand login-brand">
          <div class="brand-mark">PS</div>
          <div>
            <strong>项目支持管理系统</strong>
            <span>Python API / PostgreSQL / 流程配置</span>
          </div>
        </div>
        <label>用户名<input name="username" value="admin" required /></label>
        <label>密码<input name="password" type="password" value="admin123" required /></label>
        <button class="primary">登录系统</button>
        <p class="muted">默认账号：admin / admin123。正式部署后请立即修改。</p>
      </form>
    </section>

    <div class="app-shell hidden" id="appShell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">PS</div>
          <div>
            <strong>项目支持中心</strong>
            <span>登录 / 权限 / 流程</span>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active" data-view="dashboard">总览</button>
          <button class="nav-item" data-view="users">用户部门</button>
          <button class="nav-item" data-view="projects">项目信息</button>
          <button class="nav-item" data-view="requests">权限申请</button>
          <button class="nav-item" data-view="supports">项目支持</button>
          <button class="nav-item" data-view="workflows">流程配置</button>
        </nav>

        <div class="role-card">
          <label>当前登录</label>
          <div id="currentUserMeta" class="role-meta">未登录</div>
          <button class="secondary full-button" id="logoutBtn">退出登录</button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Project Support Management</p>
            <h1 id="pageTitle">总览</h1>
          </div>
          <div class="topbar-actions">
            <button class="secondary" id="refreshBtn">刷新数据</button>
          </div>
        </header>

        <section class="view active" id="dashboardView">
          <div class="metrics">
            <div class="metric"><span>用户</span><strong id="userCount">0</strong></div>
            <div class="metric"><span>部门</span><strong id="departmentCount">0</strong></div>
            <div class="metric"><span>项目</span><strong id="projectCount">0</strong></div>
            <div class="metric"><span>项目支持</span><strong id="supportCount">0</strong></div>
          </div>
          <div class="split-layout">
            <section class="panel">
              <div class="panel-head"><h2>部门默认权限</h2></div>
              <div id="departmentSummary" class="compact-list"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><h2>最近项目支持</h2></div>
              <div id="recentSupports" class="timeline"></div>
            </section>
          </div>
        </section>

        <section class="view" id="usersView">
          <div class="toolbar">
            <button class="secondary" id="openDepartmentDialogBtn">配置部门权限</button>
            <button class="primary" id="openUserDialogBtn">新建用户</button>
          </div>
          <div id="userList" class="table-wrap"></div>
        </section>

        <section class="view" id="projectsView">
          <div id="projectList" class="table-wrap"></div>
        </section>

        <section class="view" id="requestsView">
          <div class="toolbar">
            <button class="primary" id="openPermissionDialogBtn">申请额外权限</button>
          </div>
          <div id="requestList" class="table-wrap"></div>
        </section>

        <section class="view" id="supportsView">
          <div class="toolbar">
            <button class="primary" id="newSupportBtn">新建项目支持</button>
          </div>
          <div id="supportList" class="table-wrap"></div>
        </section>

        <section class="view" id="workflowsView">
          <div class="toolbar">
            <button class="primary" id="openWorkflowDialogBtn">新增流程</button>
          </div>
          <div id="workflowList" class="table-wrap"></div>
        </section>
      </main>
    </div>

    <dialog id="permissionDialog">
      <form method="dialog" class="modal-form" id="permissionForm">
        <header>
          <h2>申请额外权限</h2>
          <button type="button" class="icon-button" data-close="permissionDialog">×</button>
        </header>
        <div class="form-grid">
          <label>项目<select name="project_id" id="permissionProjectSelect" required></select></label>
          <label>申请范围
            <select name="permission_scope">
              <option value="login">登录信息</option>
              <option value="server">服务器信息</option>
              <option value="database">数据库信息</option>
              <option value="all">全部项目信息</option>
            </select>
          </label>
          <label class="full">申请原因<textarea name="reason" rows="4" required></textarea></label>
        </div>
        <footer>
          <button type="button" class="secondary" data-close="permissionDialog">取消</button>
          <button class="primary">提交申请</button>
        </footer>
      </form>
    </dialog>

    <dialog id="userDialog">
      <form method="dialog" class="modal-form" id="userForm">
        <header>
          <h2>新建用户</h2>
          <button type="button" class="icon-button" data-close="userDialog">×</button>
        </header>
        <div class="form-grid">
          <label>登录用户名<input name="username" required /></label>
          <label>初始密码<input name="password" type="password" value="123456" required /></label>
          <label>姓名<input name="name" required /></label>
          <label>企业微信 UserID<input name="wechat_user_id" /></label>
          <label>手机号<input name="mobile" /></label>
          <label>职位<input name="title" /></label>
          <label class="full">部门<select name="department_id" id="userDepartmentSelect" required></select></label>
        </div>
        <footer>
          <button type="button" class="secondary" data-close="userDialog">取消</button>
          <button class="primary">保存用户</button>
        </footer>
      </form>
    </dialog>

    <dialog id="departmentDialog">
      <form method="dialog" class="modal-form" id="departmentForm">
        <header>
          <h2>配置部门默认权限</h2>
          <button type="button" class="icon-button" data-close="departmentDialog">×</button>
        </header>
        <div class="form-grid">
          <label>部门<select name="department_id" id="departmentConfigSelect" required></select></label>
          <label class="full">默认权限，逗号分隔
            <textarea name="default_permissions" id="departmentPermissionsInput" rows="5" required></textarea>
          </label>
        </div>
        <footer>
          <button type="button" class="secondary" data-close="departmentDialog">取消</button>
          <button class="primary">保存配置</button>
        </footer>
      </form>
    </dialog>

    <dialog id="supportDialog">
      <form method="dialog" class="modal-form" id="supportForm">
        <header>
          <h2>新建项目支持</h2>
          <button type="button" class="icon-button" data-close="supportDialog">×</button>
        </header>
        <div class="form-grid">
          <label>项目<select name="project_id" id="supportProjectSelect" required></select></label>
          <label>流程<select name="workflow_id" id="supportWorkflowSelect" required></select></label>
          <label>申请人<select name="requester_id" id="supportRequesterSelect" required></select></label>
          <label>处理人<select name="assignee_id" id="supportAssigneeSelect"></select></label>
          <label>支持类型
            <select name="support_type">
              <option>服务更新</option>
              <option>项目支持</option>
              <option>问题处理</option>
              <option>其他问题</option>
            </select>
          </label>
          <label>优先级
            <select name="priority">
              <option>普通</option>
              <option>高</option>
              <option>紧急</option>
              <option>低</option>
            </select>
          </label>
          <label class="full">标题<input name="title" required /></label>
          <label class="full">描述<textarea name="description" rows="4" required></textarea></label>
        </div>
        <footer>
          <button type="button" class="secondary" data-close="supportDialog">取消</button>
          <button class="primary">提交项目支持</button>
        </footer>
      </form>
    </dialog>

    <dialog id="workflowDialog">
      <form method="dialog" class="modal-form" id="workflowForm">
        <header>
          <h2>新增流程</h2>
          <button type="button" class="icon-button" data-close="workflowDialog">×</button>
        </header>
        <div class="form-grid">
          <label>流程名称<input name="name" required /></label>
          <label>默认流程
            <select name="is_default">
              <option value="false">否</option>
              <option value="true">是</option>
            </select>
          </label>
          <label class="full">说明<textarea name="description" rows="3"></textarea></label>
          <label class="full">步骤 JSON<textarea name="steps" rows="7" required>[{"key":"delivery_request","name":"交付提需求"},{"key":"dev_build","name":"研发开发"},{"key":"ops_release","name":"运维发布"}]</textarea></label>
        </div>
        <footer>
          <button type="button" class="secondary" data-close="workflowDialog">取消</button>
          <button class="primary">保存流程</button>
        </footer>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
